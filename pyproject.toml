[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "settings"]
section-order = [
    "future", "standard-library", "third-party", "rest-framework",
    "django", "first-party", "local-folder",
]

[tool.ruff.lint.isort.sections]
rest-framework = ["rest_framework", "rest_framework_simplejwt"]
django = ["django"]
